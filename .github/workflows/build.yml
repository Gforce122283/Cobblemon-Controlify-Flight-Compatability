name: AI Mod Compiler

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Mod with Gradle
      run: ./gradlew build

    - name: Upload Finished Jar
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Minecraft-Mod
        path: build/libs/*.jar
